# Dependabot config. Weekly version PRs for both Cargo deps and the GitHub
# Actions used by the workflows in `.github/workflows/`. Security alerts
# (separate, GitHub-native) flow through anytime an advisory hits — toggle
# in repo Settings → Security if not already enabled.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
